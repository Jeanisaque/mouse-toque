name: Leitor de Livros (APK)

on:
  push:
    branches: [main]
    paths:
      - "leitor-livros/**"
      - "leitor-livros-app/**"
      - ".github/workflows/app-leitor.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }

      - name: Montar o app
        working-directory: leitor-livros-app
        run: |
          npm install
          npm run web
          npx cap add android
          npx cap sync android

      - name: Gerar o APK
        working-directory: leitor-livros-app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../LeitorDeLivros.apk

      - uses: actions/upload-artifact@v4
        with: { name: LeitorDeLivros, path: LeitorDeLivros.apk }

      - name: Publicar
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete leitor -y --cleanup-tag || true
          gh release create leitor LeitorDeLivros.apk --title "Leitor de Livros 1.0.${{ github.run_number }}" \
            --notes "Baixe LeitorDeLivros.apk no celular e instale (permita 'fontes desconhecidas')." --latest=false
