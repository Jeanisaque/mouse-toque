name: App da TV (Android)

on:
  push:
    branches: [main]
    paths:
      - "tv/**"
      - "mouse_toque.py"
      - ".github/workflows/app-tv.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-tv
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Copiar a tela do celular para dentro do app
        run: |
          mkdir -p tv/app/src/main/assets
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("m", "mouse_toque.py")
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          html = m.PAGINA_CELULAR.replace("{{VERSAO}}", m.VERSAO + " · TV")
          open("tv/app/src/main/assets/celular.html", "w", encoding="utf-8").write(html)
          PY

      - name: Chave de assinatura (se configurada)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/touchcell.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/touchcell.jks" >> "$GITHUB_ENV"
          fi

      - name: Gerar o APK
        working-directory: tv
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            gradle --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../TouchCell-TV.apk
          else
            gradle --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../TouchCell-TV.apk
          fi
          ls -la ../TouchCell-TV.apk
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$AS" verify --print-certs ../TouchCell-TV.apk | grep -m1 "SHA-256" | sed 's/.*: //' > ../assinatura.txt || true
          echo "Assinatura: $(cat ../assinatura.txt)"

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '{"versionCode": %s, "versionName": "1.0.%s"}\n' "${{ github.run_number }}" "${{ github.run_number }}" > versao-tv.json
          gh release delete tv -y --cleanup-tag || true
          gh release create tv TouchCell-TV.apk versao-tv.json \
            --title "Touch Cell TV (Android TV) 1.0.${{ github.run_number }}" \
            --notes "Instale na TV pelo app Downloader com o link: https://github.com/Jeanisaque/mouse-toque/releases/download/tv/TouchCell-TV.apk  Depois ative em Configuracoes > Preferencias do dispositivo > Acessibilidade > Touch Cell. Criado pelos irmãos Joel Andrade e Isaque Andrade.  Assinatura SHA-256: $(cat assinatura.txt)" \
            --latest=false
