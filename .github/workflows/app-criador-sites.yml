name: Criador de Sites (Android)

on:
  push:
    branches: [main]
    paths:
      - "criador-sites/**"
      - ".github/workflows/app-criador-sites.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-criador-sites
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Chave de assinatura (se configurada)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/touchcell.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/touchcell.jks" >> "$GITHUB_ENV"
          fi

      - name: Gerar o APK
        working-directory: criador-sites
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            gradle --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../CriadorDeSites.apk
          else
            gradle --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../CriadorDeSites.apk
          fi
          ls -la ../CriadorDeSites.apk

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete criador-sites -y --cleanup-tag || true
          gh release create criador-sites CriadorDeSites.apk \
            --title "Criador de Sites 1.0.${{ github.run_number }}" \
            --notes "Baixe o APK: https://github.com/Jeanisaque/mouse-toque/releases/download/criador-sites/CriadorDeSites.apk" \
            --latest=false
